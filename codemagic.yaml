# Receta de Codemagic para compilar Palabrazo para Android (.aab) para subir a Play Console.
# ⚠️ Sin probar: puede necesitar ajustes.
workflows:
  android-release:
    name: Palabrazo Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - palabrazo_keystore   # nombre de referencia del keystore ya cargado en Codemagic (Team settings > Code signing identities > Android)
      vars:
        PACKAGE_NAME: "com.marianobazan.palabrazo"
      node: 20
    scripts:
      - name: Organizar archivos (index.html, privacy.html e icon.png están sueltos en la raíz del repo)
        script: |
          mkdir -p www resources
          cp index.html www/index.html
          cp privacy.html www/privacy.html
          cp icon.png resources/icon.png
      - name: Instalar dependencias
        script: npm install
      - name: Agregar proyecto Android
        script: npx cap add android
      - name: Generar ícono de la app (desde resources/icon.png)
        script: npx @capacitor/assets generate --iconBackgroundColor '#6a1fd0' --iconBackgroundColorDark '#2b0d55' --android
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Número de versión
        script: |
          cd android
          echo "Build number: $BUILD_NUMBER"
      - name: Generar .aab firmado
        script: |
          cd android
          ./gradlew bundleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName="1.0.$BUILD_NUMBER"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - marianotbazan@gmail.com
        notify:
          success: true
          failure: true
