# Receta de Codemagic para compilar Palabrazo para Android (.aab) para subir a Play Console.
# ⚠️ Sin probar: puede necesitar ajustes.
workflows:
  android-release:
    name: Palabrazo Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - palabrazo_keystore   # nombre de referencia del keystore ya cargado en Codemagic (Team settings > Code signing identities > Android)
      vars:
        PACKAGE_NAME: "com.marianobazan.palabrazo"
      node: 20
    scripts:
      - name: Organizar archivos (index.html, privacy.html e icon.png están sueltos en la raíz del repo)
        script: |
          mkdir -p www resources
          cp index.html www/index.html
          cp privacy.html www/privacy.html
          cp icon.png resources/icon.png
      - name: Instalar dependencias
        script: npm install
      - name: Agregar proyecto Android
        script: npx cap add android
      - name: Subir versiones de Android (min 24, target/compile 36)
        script: |
          cd android
          sed -i.bak -E 's/minSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/minSdkVersion = 24/' variables.gradle
          sed -i.bak -E 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/' variables.gradle
          sed -i.bak -E 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 36/' variables.gradle
          cat variables.gradle
      - name: Instalar plataforma Android 36 en el SDK
        script: |
          yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true
      - name: Configurar firma de la app (Android signing)
        script: |
          cd android
          python3 - <<'EOF'
          import re
          path = "app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
          '''

          content = content.replace("android {", "android {\n" + signing_block, 1)

          content = re.sub(
              r'(buildTypes\s*\{\s*release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              content
          )

          # Forzar versión reciente de Play Billing Library (requerida por Google Play)
          if "configurations.all" not in content:
              content += '''
          configurations.all {
              resolutionStrategy {
                  force "com.android.billingclient:billing:8.0.0"
                  force "com.android.billingclient:billing-ktx:8.0.0"
              }
          }
          '''

          # Hacer que versionCode/versionName tomen el número de build real (no quedar fijo en 1 / 1.0)
          content = re.sub(
              r'versionCode\s+\d+',
              'versionCode (project.hasProperty("versionCode") ? (project.property("versionCode") as Integer) : 1)',
              content
          )
          content = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName (project.hasProperty("versionName") ? project.property("versionName") : "1.0")',
              content
          )

          with open(path, "w") as f:
              f.write(content)
          EOF
          cat app/build.gradle
      - name: Generar ícono de la app (desde resources/icon.png)
        script: npx @capacitor/assets generate --iconBackgroundColor '#6a1fd0' --iconBackgroundColorDark '#2b0d55' --android
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Número de versión
        script: |
          cd android
          echo "Build number: $BUILD_NUMBER"
      - name: Generar .aab firmado
        script: |
          cd android
          ./gradlew bundleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName="1.0.$BUILD_NUMBER"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - marianotbazan@gmail.com
        notify:
          success: true
          failure: true
